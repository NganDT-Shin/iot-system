<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - IoT System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f4f8;
        }

        .login-card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
            width: 100%;
            max-width: 400px;
            border-top: 4px solid #3b82f6;
        }

        .login-card h2 {
            font-size: 24px;
            color: #1e3a8a;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-login:hover {
            background-color: #2563eb;
        }

        .error-message {
            color: #ef4444;
            font-size: 13px;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>IoT SYSTEM</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Tài khoản</label>
                <input type="text" id="username" required placeholder="Nhập tên đăng nhập...">
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" required placeholder="Nhập mật khẩu...">
            </div>
            <button type="submit" class="btn-login">Đăng Nhập</button>
            <div class="error-message" id="errorMsg"></div>
        </form>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            fetch('http://localhost:5000/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    // Lưu Token vào localStorage để sử dụng cho các trang khác
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.user.username);
                    // Chuyển hướng về trang dashboard chính
                    window.location.href = 'dashboard.html';
                } else {
                    errorMsg.innerText = data.message || 'Đăng nhập thất bại!';
                }
            })
            .catch(err => {
                console.error('Lỗi:', err);
                errorMsg.innerText = 'Không thể kết nối đến server!';
            });
        }
    </script>
</body>
</html>
